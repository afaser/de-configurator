name: Build and Package

on:
  push:
    branches: [ trunk, main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ trunk, main, master ]

jobs:
  build-linux:
    name: Build Standard Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Cargo Build Release
        run: cargo build --release

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: de-configurator-linux
          path: target/release/de-configurator

  build-nix:
    name: Build Nix Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor Cargo dependencies
        run: cargo vendor

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Nix Build
        run: nix-build default.nix

      - name: Upload Nix Binary
        uses: actions/upload-artifact@v4
        with:
          name: de-configurator-nix
          path: result/bin/de-configurator

  release:
    name: Create GitHub Release
    needs: [build-linux, build-nix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Linux Binary
        uses: actions/download-artifact@v4
        with:
          name: de-configurator-linux
          path: ./artifacts-linux

      - name: Download Nix Binary
        uses: actions/download-artifact@v4
        with:
          name: de-configurator-nix
          path: ./artifacts-nix

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp ./artifacts-linux/de-configurator ./release-assets/de-configurator-linux-x86_64
          cp ./artifacts-nix/de-configurator ./release-assets/de-configurator-nix-x86_64

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/de-configurator-linux-x86_64
            release-assets/de-configurator-nix-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
